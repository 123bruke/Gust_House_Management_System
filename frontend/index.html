<!doctype html>
<html lang="am">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="Family Guest House — Modern guest house management and hospitality operations software." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='8' fill='%23FF385C'/><path d='M8 14L16 7L24 14V23C24 23.5523 23.5523 24 23 24H9C8.44772 24 8 23.5523 8 23V14Z' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/><path d='M13 24V16H19V24' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>Family Guest House — Management System</title>
    <script>
      // Apply saved theme before first paint to avoid flash of wrong theme
      ;(function () {
        try {
          var stored = localStorage.getItem('gh-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#121417' : '#FFFFFF')
        } catch (e) {}
      })()
      // Apply saved language before first paint (default Amharic)
      ;(function () {
        try {
          var lang = localStorage.getItem('gh-language')
          if (lang === 'en' || lang === 'am') document.documentElement.lang = lang
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-white text-[#222222] antialiased selection:bg-[#FFF0F2] selection:text-[#FF385C]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
