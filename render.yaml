services:
  - type: web
    name: family-guest-house-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: family-guest-house-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: family-guest-house-db
    databaseName: guest_house
    user: guest_house_app
    plan: basic-1gb
    region: oregon
